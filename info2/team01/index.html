<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ノート共有アプリ (Ver.0.4 試作品)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- ヘッダーエリア -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-3 flex flex-col sm:flex-row justify-between items-center gap-2">
            <h1 class="text-xl font-bold flex items-center gap-2">
                📓 ノート共有アプリ <span class="text-xs bg-indigo-500 px-2 py-0.5 rounded-full">Ver.0.4 試作品</span>
            </h1>
            <p class="text-xs text-indigo-200">テスト直前の「困った！」を解決する</p>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-grow flex flex-col gap-6">

        <!-- 参加クラス / グループエリア -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-sm font-semibold text-slate-500 mb-2">🏫 参加クラス / グループ</h2>
            <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between">
                <div class="flex items-center gap-2 flex-grow">
                    <select id="classSelect" class="border border-slate-300 rounded-lg p-2 text-sm flex-grow focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <!-- JavaScriptでクラス一覧を動的に挿入 -->
                    </select>
                </div>
                <div class="flex gap-2">
                    <button type="button" onclick="openClassModal()" class="bg-indigo-50 text-indigo-600 border border-indigo-200 hover:bg-indigo-100 text-sm px-3 py-2 rounded-lg font-medium transition whitespace-nowrap">
                        ＋ クラス作成
                    </button>
                    <button type="button" onclick="deleteCurrentClass()" class="bg-rose-50 text-rose-600 border border-rose-200 hover:bg-rose-100 text-sm px-3 py-2 rounded-lg font-medium transition whitespace-nowrap">
                        🗑️ このクラスを削除
                    </button>
                </div>
            </div>
        </section>

        <!-- アプリのメインレイアウト -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- 左側：ノート投稿フォーム -->
            <section class="md:col-span-1 bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col gap-4 h-fit">
                <h2 class="text-md font-bold text-slate-700 border-b pb-2">✏️ ノートを投稿する</h2>
                <form id="postForm" class="flex flex-col gap-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">科目</label>
                        <select id="postSubject" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
                            <option value="数学">数学</option>
                            <option value="英語">英語</option>
                            <option value="国語">国語</option>
                            <option value="理科">理科</option>
                            <option value="社会">社会</option>
                            <option value="情報">情報</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">タグ（例: テスト範囲, 3章）</label>
                        <input type="text" id="postTag" placeholder="カンマ区切り等で入力" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">ノート画像</label>
                        <input type="file" id="postImage" accept="image/*" class="w-full text-xs text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100" required>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">メモ・ポイント</label>
                        <textarea id="postMemo" rows="2" placeholder="ここがテストに出るらしい！" class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 rounded-lg text-sm shadow transition">
                        投稿する
                    </button>
                </form>
            </section>

            <!-- 右側：検索・閲覧・拡大エリア -->
            <section class="md:col-span-2 flex flex-col gap-4">
                
                <!-- 検索・フィルターエリア -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col sm:flex-row gap-3 items-center justify-between">
                    <div class="w-full sm:w-auto flex-grow">
                        <input type="text" id="searchInput" placeholder="🔍 タグやキーワードで検索..." class="w-full border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    </div>
                    <div class="w-full sm:w-auto flex items-center gap-2">
                        <select id="filterSubject" class="w-full sm:w-auto border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                            <option value="すべて">全科目表示</option>
                            <option value="数学">数学</option>
                            <option value="英語">英語</option>
                            <option value="国語">国語</option>
                            <option value="理科">理科</option>
                            <option value="社会">社会</option>
                            <option value="情報">情報</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>
                </div>

                <!-- ノート一覧カードエリア -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex-grow">
                    <h2 class="text-md font-bold text-slate-700 border-b pb-2 mb-4 flex justify-between items-center">
                        <span>📖 共有されたノート一覧</span>
                        <span id="noteCount" class="text-xs font-normal text-slate-500">0件</span>
                    </h2>
                    
                    <div id="noNotesMessage" class="hidden text-center py-10 text-slate-400 text-sm">
                        投稿されたノートがまだありません。<br>最初のノートを投稿してみよう！
                    </div>

                    <div id="notesContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <!-- 動的挿入 -->
                    </div>
                </div>

            </section>
        </div>
    </main>

    <!-- 画像拡大表示用モーダル（より大きく表示するように改善） -->
    <div id="imageModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-center justify-center p-2 sm:p-4">
        <div class="bg-white rounded-xl max-w-5xl w-full p-4 flex flex-col gap-3 relative max-h-[95vh] overflow-y-auto shadow-2xl">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 id="modalTitle" class="font-bold text-slate-700 text-base">ノート画像詳細</h3>
                <button type="button" onclick="closeImageModal()" class="text-slate-400 hover:text-slate-600 font-bold text-xl px-3 py-1">✕</button>
            </div>
            <!-- 画像表示部分：高さを max-h-[80vh] に拡大 -->
            <div class="flex justify-center bg-slate-900 rounded-lg overflow-hidden p-2">
                <img id="modalImg" src="" alt="拡大画像" class="max-h-[80vh] w-auto object-contain">
            </div>
            <p id="modalMemo" class="text-sm text-slate-700 bg-slate-50 p-3 rounded-lg border border-slate-200"></p>
        </div>
    </div>

    <!-- クラス作成用モーダル -->
    <div id="classModal" class="fixed inset-0 bg-black/50 hidden z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6 flex flex-col gap-4 shadow-lg">
            <h3 class="font-bold text-slate-800 text-base">新しいクラス/グループを作成</h3>
            <p class="text-xs text-slate-500">参加したいクラス名を入力してください（例: 「3年2組数学係」「放課後勉強会」など）</p>
            <input type="text" id="newClassNameInput" placeholder="クラス名を入力" class="border border-slate-300 rounded-lg p-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <div class="flex justify-end gap-2 mt-2">
                <button type="button" onclick="closeClassModal()" class="px-4 py-2 text-sm bg-slate-100 text-slate-600 rounded-lg hover:bg-slate-200">キャンセル</button>
                <button type="button" onclick="createNewClass()" class="px-4 py-2 text-sm bg-indigo-600 text-white rounded-lg hover:bg-indigo-700">作成して参加</button>
            </div>
        </div>
    </div>

    <!-- フッター -->
    <footer class="text-center py-4 text-xs text-slate-400">
        情報Ⅱ オリジナルWebアプリ試作品 (Ver.0.4)
    </footer>

    <!-- JavaScript ロジック -->
    <script>
        let classes = JSON.parse(localStorage.getItem('sharenote_classes')) || [
            { id: 'class_1a', name: '1年A組 全体ノート' },
            { id: 'class_test_group', name: 'テスト対策・放課後グループ' }
        ];

        let currentClassId = localStorage.getItem('sharenote_current_class') || (classes.length > 0 ? classes[0].id : '');
        let allNotes = JSON.parse(localStorage.getItem('sharenote_notes')) || {};

        window.onload = function() {
            if (!classes.some(c => c.id === currentClassId) && classes.length > 0) {
                currentClassId = classes[0].id;
            }

            renderClassSelect();
            renderNotes();

            const postForm = document.getElementById('postForm');
            if (postForm) postForm.addEventListener('submit', handlePostNote);

            const searchInput = document.getElementById('searchInput');
            if (searchInput) searchInput.addEventListener('input', renderNotes);

            const filterSubject = document.getElementById('filterSubject');
            if (filterSubject) filterSubject.addEventListener('change', renderNotes);

            const classSelect = document.getElementById('classSelect');
            if (classSelect) {
                classSelect.addEventListener('change', function(e) {
                    currentClassId = e.target.value;
                    localStorage.setItem('sharenote_current_class', currentClassId);
                    renderNotes();
                });
            }
        };

        function renderClassSelect() {
            const select = document.getElementById('classSelect');
            if (!select) return;
            
            select.innerHTML = '';
            
            if (classes.length === 0) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '（クラスがありません。作成してください）';
                select.appendChild(opt);
                return;
            }

            classes.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.textContent = c.name;
                if (c.id === currentClassId) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            });
        }

        function openClassModal() {
            const modal = document.getElementById('classModal');
            const input = document.getElementById('newClassNameInput');
            if (modal && input) {
                input.value = '';
                modal.classList.remove('hidden');
                setTimeout(() => input.focus(), 50);
            }
        }

        function closeClassModal() {
            const modal = document.getElementById('classModal');
            if (modal) modal.classList.add('hidden');
        }

        function createNewClass() {
            const nameInput = document.getElementById('newClassNameInput');
            if (!nameInput) return;

            const name = nameInput.value.trim();
            if (!name) {
                alert('クラス名を入力してください');
                return;
            }

            const newId = 'class_' + Date.now();
            classes.push({ id: newId, name: name });
            localStorage.setItem('sharenote_classes', JSON.stringify(classes));

            currentClassId = newId;
            localStorage.setItem('sharenote_current_class', currentClassId);

            closeClassModal();
            renderClassSelect();
            renderNotes();
        }

        function deleteCurrentClass() {
            if (classes.length <= 1) {
                alert('最後のクラスは削除できません。');
                return;
            }

            const targetClass = classes.find(c => c.id === currentClassId);
            const className = targetClass ? targetClass.name : 'このクラス';

            if (confirm(`「${className}」を削除してもよろしいですか？（投稿されたノートも含まれます）`)) {
                classes = classes.filter(c => c.id !== currentClassId);
                localStorage.setItem('sharenote_classes', JSON.stringify(classes));

                delete allNotes[currentClassId];
                localStorage.setItem('sharenote_notes', JSON.stringify(allNotes));

                currentClassId = classes[0].id;
                localStorage.setItem('sharenote_current_class', currentClassId);

                renderClassSelect();
                renderNotes();
            }
        }

        function handlePostNote(e) {
            e.preventDefault();

            if (!currentClassId) {
                alert('先にクラスを作成・選択してください。');
                return;
            }

            const subject = document.getElementById('postSubject').value;
            const tag = document.getElementById('postTag').value.trim();
            const memo = document.getElementById('postMemo').value.trim();
            const imageInput = document.getElementById('postImage');

            if (imageInput && imageInput.files && imageInput.files[0]) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    const imageDataUrl = uploadEvent.target.result;

                    const newNote = {
                        id: Date.now(),
                        subject: subject,
                        tag: tag,
                        image: imageDataUrl,
                        memo: memo,
                        date: new Date().toLocaleDateString()
                    };

                    if (!allNotes[currentClassId]) {
                        allNotes[currentClassId] = [];
                    }
                    allNotes[currentClassId].unshift(newNote);

                    localStorage.setItem('sharenote_notes', JSON.stringify(allNotes));

                    const postForm = document.getElementById('postForm');
                    if (postForm) postForm.reset();
                    renderNotes();
                };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                alert('ノート画像を選択してください。');
            }
        }

        function renderNotes() {
            const container = document.getElementById('notesContainer');
            const noNotesMsg = document.getElementById('noNotesMessage');
            const searchInput = document.getElementById('searchInput');
            const filterSubject = document.getElementById('filterSubject');
            const noteCount = document.getElementById('noteCount');

            if (!container) return;

            const searchKeyword = searchInput ? searchInput.value.toLowerCase() : '';
            const filterSubj = filterSubject ? filterSubject.value : 'すべて';

            container.innerHTML = '';

            const notesList = allNotes[currentClassId] || [];

            const filteredNotes = notesList.filter(note => {
                const matchesSubject = (filterSubj === 'すべて' || note.subject === filterSubj);
                const matchesSearch = (note.tag && note.tag.toLowerCase().includes(searchKeyword)) || 
                                      (note.memo && note.memo.toLowerCase().includes(searchKeyword)) ||
                                      (note.subject && note.subject.toLowerCase().includes(searchKeyword));
                return matchesSubject && matchesSearch;
            });

            if (noteCount) noteCount.textContent = filteredNotes.length + '件';

            if (filteredNotes.length === 0) {
                if (noNotesMsg) noNotesMsg.classList.remove('hidden');
                return;
            } else {
                if (noNotesMsg) noNotesMsg.classList.add('hidden');
            }

            filteredNotes.forEach(note => {
                const card = document.createElement('div');
                card.className = 'border border-slate-200 rounded-xl overflow-hidden shadow-sm flex flex-col bg-slate-50 hover:shadow transition';

                let tagsHtml = '';
                if (note.tag) {
                    const tags = note.tag.split(/[、,]/);
                    tags.forEach(t => {
                        if(t.trim()) {
                            tagsHtml += `<span class="bg-indigo-50 text-indigo-600 text-xs px-2 py-0.5 rounded-full font-medium">#${t.trim()}</span>`;
                        }
                    });
                }

                const safeImg = note.image || '';
                const safeSubj = note.subject || '';
                const safeMemoAttr = escapeAttribute(note.memo);
                const safeMemoHtml = note.memo ? escapeHtml(note.memo) : '（メモなし）';

                card.innerHTML = `
                    <div class="relative h-40 bg-slate-200 cursor-pointer overflow-hidden group" onclick="openImageModal('${safeImg}', '${safeSubj}', '${safeMemoAttr}')">
                        <img src="${safeImg}" alt="ノート画像" class="w-full h-full object-cover group-hover:scale-105 transition duration-200">
                        <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs font-bold">
                            🔍 クリックで拡大
                        </div>
                        <span class="absolute top-2 left-2 bg-indigo-600 text-white text-xs px-2 py-1 rounded-md font-bold shadow">
                            ${safeSubj}
                        </span>
                    </div>
                    <div class="p-3 flex flex-col gap-2 flex-grow">
                        <div class="flex flex-wrap gap-1">
                            ${tagsHtml}
                        </div>
                        <p class="text-xs text-slate-600 line-clamp-2 flex-grow">${safeMemoHtml}</p>
                        <div class="text-[10px] text-slate-400 text-right mt-auto">投稿日: ${note.date || ''}</div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openImageModal(imgSrc, subject, memo) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            const modalTitle = document.getElementById('modalTitle');
            const modalMemo = document.getElementById('modalMemo');

            if (modal && modalImg && modalTitle && modalMemo) {
                modalImg.src = imgSrc;
                modalTitle.textContent = subject + ' のノート画像詳細';
                modalMemo.textContent = memo ? memo : '（メモなし）';
                modal.classList.remove('hidden');
            }
        }

        function closeImageModal() {
            const modal = document.getElementById('imageModal');
            if (modal) modal.classList.add('hidden');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&'`<>]/g, function(match) {
                return {
                    '&': '&amp;',
                    "'": '&#x27;',
                    '`': '&#x60;',
                    '<': '&lt;',
                    '>': '&gt;',
                }[match];
            });
        }

        function escapeAttribute(str) {
            if (!str) return '';
            return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
    </script>
</body>
</html>
