<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>朝の準備サポートアプリ (Ver.0.1)</title>
    <style>
        /* スマートフォンでも見やすいシンプルなデザイン（CSS） */
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f4f8;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1, h2 {
            text-align: center;
            color: #0066cc;
        }
        .input-group {
            margin-bottom: 20px;
            text-align: center;
        }
        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        input[type="time"] {
            font-size: 1.2rem;
            padding: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #0066cc;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0052a3;
        }
        .task-list {
            margin-top: 20px;
        }
        .task-item {
            padding: 12px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .task-item.active {
            background-color: #fff3cd;
            border-left: 5px solid #ffc107;
            font-weight: bold;
        }
        .task-time {
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>朝の準備サポート</h1>
    
    <!-- MUST①: 家出る時間を入力する部分 -->
    <div class="input-group">
        <label for="departureTime">家を出る時間（目標）</label>
        <input type="time" id="departureTime" value="08:00">
        <button onclick="calculateSchedule()">スケジュールを作成する</button>
    </div>

    <!-- MUST②: 朝やることを順番に表示する部分 -->
    <div id="scheduleArea" style="display: none;">
        <h2>逆算スケジュール</h2>
        <div class="task-list" id="taskList">
            <!-- ここにJavaScriptでタスクが追加されます -->
        </div>
    </div>
</div>

<script>
    // 【仮データ】高校生が後から内容や所要時間（分）を変更しやすいように配列で定義
    const defaultTasks = [
        { name: "起きる・布団から出る", duration: 5 },
        { name: "洗顔・歯磨き", duration: 10 },
        { name: "朝ごはんを食べる", duration: 15 },
        { name: "着替え・髪を整える", duration: 10 },
        { name: "持ち物の最終チェック", duration: 5 }
    ];

    // スケジュールを逆算して表示する関数（MUST① & MUST②）
    function calculateSchedule() {
        const departureInput = document.getElementById('departureTime').value;
        if (!departureInput) {
            alert('家を出る時間を入力してください');
            return;
        }

        // 入力された時間を分解（例 "08:00" -> 時:8, 分:0）
        const [depHours, depMinutes] = departureInput.split(':').map(Number);
        
        // 基準となる出発時間を今日のデートオブジェクトとして作成
        let targetTime = new Date();
        targetTime.setHours(depHours, depMinutes, 0, 0);

        const taskListDiv = document.getElementById('taskList');
        taskListDiv.innerHTML = ''; // 表示をクリア

        // タスクを後ろから順番に逆算していく
        // 例：持ち物チェック(5分) -> 7:55開始
        let schedule = [];
        
        for (let i = defaultTasks.length - 1; i >= 0; i--) {
            const task = defaultTasks[i];
            // 時間を所要分だけ戻す
            targetTime.setMinutes(targetTime.getMinutes() - task.duration);
            
            // 表示用の時間を文字列にする（例 "07:55"）
            const timeString = targetTime.toTimeString().slice(0, 5);
            
            // 配列の先頭に追加していく（画面には起きる順番で出したいので）
            schedule.unshift({
                timeStr: timeString,
                name: task.name,
                rawTime: new Date(targetTime) // 通知判定用に時間を保存
            });
        }

        // 画面にタスクを表示する
        schedule.forEach(item => {
            const itemDiv = document.createElement('div');
            itemDiv.className = 'task-item';
            // 識別しやすくするために時間をデータ属性として持たせる
            itemDiv.setAttribute('data-time', item.timeStr);
            
            itemDiv.innerHTML = `
                <span>${item.name}</span>
                <span class="task-time">${item.timeStr} 〜</span>
            `;
            taskListDiv.appendChild(itemDiv);
        });

        // スケジュールエリアを表示する
        document.getElementById('scheduleArea').style.display = 'block';
    }

    // MUST③: 時間になったら通知する機能（1秒ごとにチェックするシステム）
    function checkNotification() {
        const now = new Date();
        const currentHours = String(now.getHours()).padStart(2, '0');
        const currentMinutes = String(now.getMinutes()).padStart(2, '0');
        const currentTimeStr = `${currentHours}:${currentMinutes}`;

        // 画面上にあるタスクの時間を探す
        const taskItems = document.querySelectorAll('.task-item');
        taskItems.forEach(item => {
            const taskTime = item.getAttribute('data-time');
            
            // 現在時刻とタスクの開始時刻が一致したら通知
            if (taskTime === currentTimeStr) {
                // まだ色が変わっていなければ、アクティブ状態（黄色）にする
                if (!item.classList.contains('active')) {
                    item.classList.add('active');
                    
                    // 【外部サービス・機能の制約に関する説明】
                    // 通常の「プッシュ通知」はWebブラウザだと設定が複雑で、スマホの仕様制限も多いため、
                    // Ver.0.1では確実にブラウザで動く「アラート画面（ポップアップ）」で代用しています。
                    alert(`【時間です！】${item.innerText.split('〜')[0]}を始めてください！`);
                }
            }
        });
    }

    // 1秒（1000ミリ秒）ごとに、時間になったかチェックする時計を動かす
    setInterval(checkNotification, 1000);
</script>

</body>
</html>
