<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>情報Ⅱ アプリギャラリー</title>

  <style>
    * { box-sizing: border-box; }

    :root {
      --main: #183653;
      --main-light: #244f76;
      --accent: #24699f;
      --background: #f4f6f8;
      --text: #1e2933;
      --sub-text: #64707d;
      --card: #ffffff;
      --border: #e3e7eb;
    }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      font-family: "BIZ UDPGothic", "Yu Gothic", "Meiryo", sans-serif;
      background: var(--background);
      color: var(--text);
      line-height: 1.7;
    }

    header {
      background: linear-gradient(135deg, #17324c, #244f76);
      color: white;
      padding: 58px 20px 50px;
      text-align: center;
    }

    .small-title {
      font-size: 13px;
      letter-spacing: 0.2em;
      opacity: 0.8;
      margin-bottom: 8px;
      font-weight: bold;
    }

    header h1 {
      margin: 0;
      font-size: clamp(30px, 5vw, 52px);
      line-height: 1.25;
      letter-spacing: 0.04em;
    }

    header p {
      max-width: 780px;
      margin: 20px auto 0;
      font-size: 16px;
      opacity: 0.9;
    }

    main {
      width: min(1400px, 94%);
      margin: 0 auto;
      padding: 44px 0 80px;
    }

    .intro {
      background: white;
      border-radius: 18px;
      padding: 26px 30px;
      margin-bottom: 38px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
    }

    .intro h2 {
      margin: 0 0 8px;
      color: var(--main);
      font-size: 23px;
    }

    .intro p { margin: 0; color: #46525c; }

    .gallery-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .gallery-header h2 {
      margin: 0;
      color: var(--main);
      font-size: 29px;
    }
