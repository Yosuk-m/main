<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>情報Ⅱ アプリギャラリー</title>


  <style>

    * {
      box-sizing: border-box;
    }

    :root {
      --main: #183653;
      --main-light: #244f76;
      --accent: #24699f;
      --background: #f4f6f8;
      --text: #1e2933;
      --sub-text: #64707d;
      --card: #ffffff;
      --border: #e3e7eb;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      font-family:
        "BIZ UDPGothic",
        "Yu Gothic",
        "Meiryo",
        sans-serif;

      background: var(--background);
      color: var(--text);
      line-height: 1.7;
    }


    /* ==========================================
       HEADER
    ========================================== */

    header {
      background:
        linear-gradient(
          135deg,
          #17324c,
          #244f76
        );

      color: white;

      padding:
        58px 20px 50px;

      text-align: center;
    }

    .small-title {
      font-size: 13px;
      letter-spacing: 0.2em;
      opacity: 0.8;
      margin-bottom: 8px;
      font-weight: bold;
    }

    header h1 {
      margin: 0;

      font-size:
        clamp(
          30px,
          5vw,
          52px
        );

      line-height: 1.25;
      letter-spacing: 0.04em;
    }

    header p {
      max-width: 780px;

      margin:
        20px auto 0;

      font-size: 16px;
      opacity: 0.9;
    }


    /* ==========================================
       MAIN
    ========================================== */

    main {
      width:
        min(
          1400px,
          94%
        );

      margin: 0 auto;

      padding:
        44px 0 80px;
    }


    /* ==========================================
       INTRO
    ========================================== */

    .intro {
      background: white;

      border-radius: 18px;

      padding:
        26px 30px;

      margin-bottom: 38px;

      box-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.06);
    }

    .intro h2 {
      margin: 0 0 8px;
      color: var(--main);
      font-size: 23px;
    }

    .intro p {
      margin: 0;
      color: #46525c;
    }


    /* ==========================================
       GALLERY HEADER
    ========================================== */

    .gallery-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .gallery-header h2 {
      margin: 0;
      color: var(--main);
      font-size: 29px;
    }

    .gallery-header p {
      margin: 0;
      color: #71808c;
      font-size: 13px;
      text-align: right;
    }


    /* ==========================================
       GALLERY
       PC：4列 × 3段
    ========================================== */

    .gallery {
      display: grid;

      grid-template-columns:
        repeat(
          4,
          minmax(0, 1fr)
        );

      gap: 22px;
    }


    /* ==========================================
       APP CARD
    ========================================== */

    .app-card {
      background: var(--card);

      border-radius: 18px;

      overflow: hidden;

      box-shadow:
        0 5px 18px
        rgba(0, 0, 0, 0.08);

      display: flex;
      flex-direction: column;

      min-width: 0;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .app-card:hover {
      transform: translateY(-4px);

      box-shadow:
        0 10px 28px
        rgba(0, 0, 0, 0.12);
    }


    /* ==========================================
       CARD TOP
    ========================================== */

    .card-top {
      min-height: 128px;

      padding:
        23px 22px;

      background:
        linear-gradient(
          135deg,
          #edf3f8,
          #e4edf5
        );

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .team {
      display: inline-block;

      font-size: 12px;
      font-weight: bold;

      color: #587086;

      margin-bottom: 6px;

      letter-spacing: 0.08em;
    }

    .app-name {
      margin: 0;

      color: #17324f;

      font-size: 21px;

      line-height: 1.4;

      font-weight: 700;

      overflow-wrap: anywhere;
    }


    /* ==========================================
       CARD BODY
    ========================================== */

    .card-body {
      padding:
        20px 22px 22px;

      display: flex;
      flex-direction: column;

      flex: 1;
    }

    .target {
      display: inline-block;

      align-self: flex-start;

      max-width: 100%;

      background: #edf4fb;

      color: #315d82;

      padding:
        5px 11px;

      border-radius: 20px;

      font-size: 12px;
      font-weight: bold;

      margin-bottom: 14px;
    }

    .description {
      color: #46515a;

      font-size: 14px;

      margin:
        0 0 20px;

      flex: 1;
    }


    /* ==========================================
       APP INFO
    ========================================== */

    .app-info {
      border-top:
        1px solid var(--border);

      padding-top: 13px;

      margin-bottom: 7px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 8px;
    }

    .status {
      display: inline-flex;

      align-items: center;

      gap: 6px;

      font-size: 13px;

      font-weight: bold;

      color: #217044;
    }

    .status::before {
      content: "";

      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #2ca05a;

      flex-shrink: 0;
    }

    .version {
      color: #68737c;

      font-size: 12px;

      text-align: right;

      white-space: nowrap;
    }

    .updated {
      color: #8a949c;

      font-size: 11px;

      min-height: 19px;

      margin-bottom: 11px;

      text-align: right;
    }


    /* ==========================================
       BUTTON
    ========================================== */

    .btn-app {
      display: block;

      width: 100%;

      text-align: center;

      text-decoration: none;

      background: var(--accent);

      color: white;

      border-radius: 10px;

      padding:
        12px 10px;

      font-size: 15px;

      font-weight: bold;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .btn-app:hover {
      opacity: 0.88;
      transform: translateY(-1px);
    }


    /* ==========================================
       DEVELOPMENT
    ========================================== */

    .coming-soon {
      opacity: 0.7;
    }

    .coming-soon:hover {
      transform: none;

      box-shadow:
        0 5px 18px
        rgba(0, 0, 0, 0.08);
    }

    .coming-soon .card-top {
      background: #eeeeee;
    }

    .coming-soon .app-name {
      color: #666;
    }

    .development-status {
      border-top:
        1px solid var(--border);

      padding-top: 13px;

      display: inline-flex;

      align-items: center;

      gap: 6px;

      color: #777;

      font-size: 13px;

      font-weight: bold;
    }

    .development-status::before {
      content: "";

      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #aaa;
    }


    /* ==========================================
       FOOTER
    ========================================== */

    footer {
      background: #22303c;

      color: #dce2e7;

      text-align: center;

      padding:
        30px 20px;

      font-size: 13px;
    }

    footer p {
      margin: 4px 0;
    }


    /* ==========================================
       RESPONSIVE
    ========================================== */

    @media (max-width: 1180px) {

      .gallery {
        grid-template-columns:
          repeat(
            3,
            minmax(0, 1fr)
          );
      }

    }


    @media (max-width: 820px) {

      .gallery {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
      }

    }


    @media (max-width: 560px) {

      header {
        padding:
          38px 18px 34px;
      }

      main {
        width:
          min(
            94%,
            520px
          );

        padding-top: 28px;
      }

      .intro {
        padding: 20px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .gallery-header {
        display: block;
      }

      .gallery-header p {
        text-align: left;
        margin-top: 4px;
      }

    }

  </style>

</head>


<body>


<!-- ==========================================
     HEADER
========================================== -->

<header>

  <div class="small-title">
    INFORMATION STUDY Ⅱ
  </div>

  <h1>
    情報Ⅱ アプリギャラリー
  </h1>

  <p>
    高校生が身近な困りごとや課題を発見し、
    生成AIを活用しながら企画・開発したWebアプリです。
    公開中の作品は実際に体験できます。
  </p>

</header>



<!-- ==========================================
     MAIN
========================================== -->

<main>


  <section class="intro">

    <h2>
      アプリを使ってみよう
    </h2>

    <p>
      各班が
      「誰の、どんな困りごとを解決するのか」
      を考え、
      コンセプト設計・試作・ユーザーテスト・改善を行っています。
      各アプリは開発に合わせて随時更新されます。
    </p>

  </section>



  <div class="gallery-header">

    <h2>
      Apps
    </h2>

    <p>
      TEAM 01 〜 TEAM 12
    </p>

  </div>



  <section
    class="gallery"
    id="appGallery"
  ></section>


</main>



<!-- ==========================================
     FOOTER
========================================== -->

<footer>

  <p>
    情報Ⅱ
    生成AIを活用したアプリ開発プロジェクト
  </p>

  <p>
    生徒作品のため、
    開発・改善に伴って内容が変更される場合があります。
  </p>

</footer>



<script>


/*
=========================================================
アプリ一覧
=========================================================
*/


const apps = [


  {
    team: "01",

    name:
      "ノート共有アプリ",

    target:
      "授業内容を確認したい生徒向け",

    description:
      "欠席した日や、もう一度確認したい授業のノートを共有・確認しやすくするためのアプリです。",

    path:
      "./team01/",

    status:
      "published"
  },


  {
    team: "02",

    name:
      "垢抜けコーディネートサポート",

    target:
      "自分に似合う服装を知りたい人向け",

    description:
      "自分に合った服装や組み合わせを考える手助けをし、コーディネート選びをサポートするアプリです。",

    path:
      "./team02/",

    status:
      "published"
  },


  {
    team: "03",

    name:
      "書類修正変換",

    target:
      "文章や書類を整えたい人向け",

    description:
      "入力した文章を確認し、より読みやすい表現や適切な文章へ修正・変換することを目指したアプリです。",

    path:
      "./team03/",

    status:
      "published"
  },


  {
    team: "04",

    name:
      "速度計測",

    target:
      "移動速度を確認したい人向け",

    description:
      "スマートフォンなどを利用して、移動しているときの速度を分かりやすく確認するための計測アプリです。",

    path:
      "./team04/",

    status:
      "published"
  },


  {
    team: "05",

    name:
      "ToDoリスト",

    target:
      "やることを整理したい人向け",

    description:
      "やるべきことを登録・整理し、タスクの管理を分かりやすくするためのアプリです。",

    path:
      "./team05/",

    status:
      "published"
  },


  {
    team: "06",

    name:
      "開発中",

    target:
      "内容未定",

    description:
      "現在アプリを開発しています。内容が決まり次第公開します。",

    path:
      null,

    status:
      "development"
  },


  {
    team: "07",

    name:
      "数学バトルゲーム",

    target:
      "数学をゲーム感覚で学びたい人向け",

    description:
      "数学の問題に正解してモンスターを攻撃し、敵を倒しながらポイントやレベルを上げていく学習バトルゲームです。",

    path:
      "./team07/",

    status:
      "published"
  },


  {
    team: "08",

    name:
      "推し活サポートアプリ",

    target:
      "ライブ遠征を楽しみたい人向け",

    description:
      "東京ドーム周辺のマップ・おすすめスポット・スケジュールをまとめて確認し、ライブ遠征をサポートするアプリです。",

    path:
      "./team08/",

    status:
      "published"
  },


  {
    team: "09",

    name:
      "傘シェアアプリ",

    target:
      "急な雨で傘が必要になった人向け",

    description:
      "校内の傘貸出スポットと在庫を確認し、必要な場所で簡単に傘を借りられることを目指したシェアリングアプリです。",

    path:
      "./team09/",

    status:
      "published"
  },


  {
    team: "10",

    name:
      "髪型お悩みルーレット",

    target:
      "今日の髪型に迷っている人向け",

    description:
      "天気と髪の長さを選ぶと、その日の条件に合った髪型候補をルーレット形式で提案してくれるアプリです。",

    path:
      "./team10/",

    status:
      "published"
  },


  {
    team: "11",

    name:
      "うっかりゼロアプリ",

    target:
      "提出物や持ち物の忘れを防ぎたい生徒向け",

    description:
      "提出物や持ち物を期限とともに登録し、一覧表示や完了チェックを使って忘れ物を防ぐための管理アプリです。",

    path:
      "./team11/",

    status:
      "published"
  },


  {
    team: "12",

    name:
      "おこずかい管理アプリ",

    target:
      "おこずかいを分かりやすく管理したい人向け",

    description:
      "はじめのおこずかいを設定し、使った金額や理由を記録しながら、残りのお金と使用履歴を確認できる管理アプリです。",

    path:
      "./team12/",

    status:
      "published"
  }


];



/*
=========================================================
カード生成
=========================================================
*/


function createAppCard(app) {


  if (
    app.status ===
    "development"
  ) {

    return `

      <article
        class="
          app-card
          coming-soon
        "
      >

        <div class="card-top">

          <span class="team">
            TEAM ${app.team}
          </span>

          <h3 class="app-name">
            ${app.name}
          </h3>

        </div>


        <div class="card-body">

          <span class="target">
            ${app.target}
          </span>

          <p class="description">
            ${app.description}
          </p>

          <div class="development-status">
            開発中
          </div>

        </div>

      </article>

    `;

  }



  return `

    <article
      class="app-card"
      data-app="${app.path}"
    >

      <div class="card-top">

        <span class="team">
          TEAM ${app.team}
        </span>

        <h3 class="app-name">
          ${app.name}
        </h3>

      </div>


      <div class="card-body">

        <span class="target">
          ${app.target}
        </span>

        <p class="description">
          ${app.description}
        </p>


        <div class="app-info">

          <span class="status">
            公開中
          </span>

          <span class="version">
            Ver. 確認中…
          </span>

        </div>


        <div class="updated"></div>


        <a
          class="btn-app"
          href="${app.path}"
          target="_blank"
          rel="noopener noreferrer"
        >
          アプリを使う
        </a>

      </div>

    </article>

  `;

}



/*
=========================================================
TEAM01〜TEAM12を表示
=========================================================
*/


const gallery =
  document.getElementById(
    "appGallery"
  );


gallery.innerHTML =
  apps
    .map(createAppCard)
    .join("");



/*
=========================================================
各班の index.html から
バージョン・更新日を取得
=========================================================
*/


async function loadAppInformation(
  card
) {


  const appPath =
    card.dataset.app;


  const versionElement =
    card.querySelector(
      ".version"
    );


  const updatedElement =
    card.querySelector(
      ".updated"
    );


  if (
    !appPath ||
    !versionElement
  ) {

    return;

  }



  try {


    /*
    GitHub Pagesのキャッシュ対策
    */


    const url =

      appPath +

      "index.html?v=" +

      Date.now();



    const response =

      await fetch(
        url,
        {
          cache:
            "no-store"
        }
      );



    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP " +
        response.status
      );

    }



    const html =
      await response.text();



    const parser =
      new DOMParser();



    const doc =
      parser.parseFromString(
        html,
        "text/html"
      );



    /*
    ======================================
    VERSION
    ======================================
    */


    let version = "";



    /*
    ① metaタグ
    */


    const versionMeta =

      doc.querySelector(
        'meta[name="app-version"]'
      );


    if (
      versionMeta
    ) {

      version =

        versionMeta
          .getAttribute(
            "content"
          )

        || "";

    }



    /*
    ② titleタグ
    */


    if (
      !version
    ) {


      const titleText =
        doc.title || "";


      const match =

        titleText.match(

          /(?:Ver\.?|Version)\s*([0-9]+(?:\.[0-9]+)*)/i

        );


      if (
        match
      ) {

        version =
          match[1];

      }

    }



    /*
    ③ 本文
    */


    if (
      !version
    ) {


      const bodyText =

        doc.body

          ? doc.body.textContent

          : "";


      const match =

        bodyText.match(

          /(?:Ver\.?|Version)\s*([0-9]+(?:\.[0-9]+)*)/i

        );


      if (
        match
      ) {

        version =
          match[1];

      }

    }



    /*
    バージョン表示
    */


    if (
      version
    ) {

      versionElement.textContent =

        "Ver. " +
        version;

    }

    else {

      versionElement.textContent =

        "Ver. 未設定";

    }



    /*
    ======================================
    UPDATED DATE
    ======================================
    */


    const updatedMeta =

      doc.querySelector(
        'meta[name="app-updated"]'
      );


    if (
      updatedMeta &&
      updatedElement
    ) {


      const date =

        updatedMeta
          .getAttribute(
            "content"
          );


      if (
        date
      ) {

        updatedElement.textContent =

          "更新：" +
          date;

      }

    }


  }

  catch (
    error
  ) {


    console.error(

      "アプリ情報取得失敗:",

      appPath,

      error

    );


    versionElement.textContent =

      "Ver. 公開確認中";


  }

}



/*
=========================================================
公開中アプリをすべて読み込む
=========================================================
*/


document

  .querySelectorAll(
    ".app-card[data-app]"
  )

  .forEach(
    loadAppInformation
  );


</script>


</body>

</html>
